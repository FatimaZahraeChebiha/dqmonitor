spring.application.name=backend

# MySQL
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:data_quality_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:1234}

# JPA / Flyway - schema is owned by Flyway migrations (db/migration), Hibernate only validates
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Server
server.port=${SERVER_PORT:8080}
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# CORS - comma-separated list of allowed origins, override per environment
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# JWT - short-lived access token now that refresh tokens exist (rotated, revocable
# server-side, unlike the access token itself)
app.jwt.secret=${JWT_SECRET:dev-only-secret-key-please-override-in-production-env-min-256-bits}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:14400000}
app.jwt.refresh-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS:7}

# Internal service-to-service key (used by the Python quality_check job to call back into the API)
app.internal.api-key=${INTERNAL_API_KEY:dev-internal-key-change-me}

# Default admin bootstrap (created once on startup if no ADMIN user exists)
app.admin.bootstrap-email=${ADMIN_EMAIL:admin@dqmonitor.com}
app.admin.bootstrap-password=${ADMIN_PASSWORD:Admin2026}

# Dataset storage + analysis job
app.storage.upload-dir=${UPLOAD_DIR:${user.home}/DataQualityPlatform/data/input}
app.analysis.python-executable=${PYTHON_EXECUTABLE:python}
app.analysis.script-path=${PYTHON_SCRIPT_PATH:../data-processing/spark_jobs/quality_check.py}
app.analysis.service-url=${ANALYSIS_SERVICE_URL:}

# Frontend origin used to build links inside emails (password reset, etc.)
app.frontend-url=${FRONTEND_URL:http://localhost:4200}

# Quality threshold below which a low-quality-score alert email is sent
app.notifications.low-quality-threshold=${LOW_QUALITY_THRESHOLD:80}

# Mail - defaults target the local MailHog dev catcher (no auth, no TLS).
# Override with real SMTP env vars (e.g. Gmail) for actual delivery.
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
app.mail.from=${MAIL_FROM:no-reply@dqmonitor.local}

# Actuator - health is public (needed for Docker healthchecks / load balancers),
# everything else requires ADMIN (see SecurityConfig)
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true

# OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# AI Assistant - provider abstraction. Default (ollama) is free/local/offline;
# switch to anthropic or openai in production by changing AI_PROVIDER only.
app.ai.provider=${AI_PROVIDER:ollama}
app.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
app.ai.ollama.model=${OLLAMA_MODEL:llama3.2:3b}
app.ai.anthropic.api-key=${ANTHROPIC_API_KEY:}
app.ai.anthropic.model=${ANTHROPIC_MODEL:claude-opus-4-8}
app.ai.openai.api-key=${OPENAI_API_KEY:}
app.ai.openai.model=${OPENAI_MODEL:gpt-4o-mini}
