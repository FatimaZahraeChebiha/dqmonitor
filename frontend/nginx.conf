gzip on;
gzip_vary on;
gzip_min_length 512;
gzip_comp_level 6;
gzip_types text/plain text/css application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy API calls to the backend container - the browser only ever
    # talks to this same origin, so no CORS configuration is needed in production.
    # /internal/** is intentionally NOT exposed here - it's a loopback-only
    # contract between the backend and the Python analysis job.
    location /api/ {
        client_max_body_size 100M;
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }


    # Angular's build hashes JS/CSS filenames (e.g. main-E4EYRQPG.js), so these
    # are safe to cache indefinitely - a new build means a new filename.
    location ~* \.(?:js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html is the one file whose content changes on every deploy without
    # its own URL changing (it's what points the browser at the new build's
    # hashed bundle names). With no explicit policy here it only carries the
    # default Last-Modified/ETag, which some browsers treat as heuristically
    # cacheable and can serve straight from disk without a network round trip -
    # silently keeping an old build's bundle references alive even across a
    # normal reload. Forcing revalidation on every request makes each deploy
    # take effect on the next load without depending on a hard refresh.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Angular client-side routing - fall back to index.html for unknown paths.
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
