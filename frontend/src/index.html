<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>DQMonitor - Enhanced Technologies</title>
    <script>
      // Applies the saved theme before Angular bootstraps, so there's no flash
      // of the wrong theme on load. Must stay in sync with the storage key and
      // class name ThemeService uses (core/services/theme.service.ts).
      (function () {
        try {
          var stored = localStorage.getItem('dqmonitor.theme');
          var isDark =
            stored === 'dark' ||
            (stored !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark-theme');
          }
        } catch (e) {}
      })();
    </script>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/assets/logo-icon.svg" />
    <link rel="alternate icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
